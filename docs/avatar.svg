<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1d3f8f"/>
      <stop offset=".55" stop-color="#0f2250"/>
      <stop offset="1" stop-color="#07122b"/>
    </radialGradient>
    <radialGradient id="glowO" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f5bea" stop-opacity=".8"/>
      <stop offset="1" stop-color="#2f5bea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset=".45" stop-color="#ff8a3d"/>
      <stop offset=".7" stop-color="#ff5f6d"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc15e"/>
      <stop offset="1" stop-color="#ff6f3c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#ff7a45" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- фон -->
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#grid)"/>
  <circle cx="500" cy="120" r="230" fill="url(#glowO)" filter="url(#blur40)"/>
  <circle cx="120" cy="540" r="260" fill="url(#glowB)" filter="url(#blur40)"/>

  <!-- орбиты -->
  <circle cx="320" cy="320" r="268" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="320" cy="320" r="236" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="1180 303" transform="rotate(-120 320 320)" filter="url(#glow)"/>
  <circle cx="320" cy="320" r="204" fill="none" stroke="#7aa2ff" stroke-opacity=".25" stroke-width="2"/>

  <!-- «спутники» на орбите -->
  <g filter="url(#glow)">
    <circle cx="136" cy="173" r="11" fill="#ffb547"/>
    <circle cx="549" cy="382" r="8" fill="#ff8a3d"/>
    <circle cx="378" cy="549" r="6" fill="#7aa2ff"/>
  </g>

  <!-- плитка с логотипом -->
  <g filter="url(#shadow)">
    <rect x="150" y="150" width="340" height="340" rx="88" fill="url(#tile)"/>
  </g>
  <rect x="150" y="150" width="340" height="340" rx="88" fill="url(#shine)"/>
  <g transform="translate(150 150) scale(7.0833)" fill="none" stroke="#fff" stroke-linejoin="round" stroke-linecap="round">
    <path d="M9 30V17a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v13" stroke-width="2.6"/>
    <path d="M27 20h5.2l4.8 5.4V30H27" stroke-width="2.6"/>
    <path d="M7.5 30.5h31" stroke-width="2.6"/>
    <circle cx="15" cy="33.4" r="3.4" fill="#0B1B3F" stroke-width="2.2"/>
    <circle cx="31.5" cy="33.4" r="3.4" fill="#0B1B3F" stroke-width="2.2"/>
    <path d="M13.6 22.6l3.2 3.2 5.6-6.6" stroke-width="2.6"/>
  </g>
</svg>
